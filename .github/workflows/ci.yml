name: CI

# Runs the full PyHP test suite after every commit (push) and every PR,
# on Ubuntu, Windows and macOS with PHP 8.2 and 8.3. The two native-backend
# tests compile with g++ when it is available and skip gracefully otherwise.
# A separate job proves the macOS/Linux `install.sh` + `uninstall.sh` round
# trip on a clean HOME, so the bare `pyhp` command stays first-class on Unix.

on:
  push:
  pull_request:

jobs:
  tests:
    name: PHP ${{ matrix.php }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip, curl, phar
          coverage: none

      - name: Run test suite (interpreter + transpiler + native backend)
        run: php tests/run_tests.php

  install-sh:
    name: install.sh / uninstall.sh smoke (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install from the local checkout into a clean HOME
        run: |
          ./install.sh --local . --no-path
          export PATH="$HOME/.local/bin:$PATH"
          pyhp version
          pyhp run examples/01_hello.pyh
          pyhp build examples/01_hello.pyh -o hello.php
          php hello.php | head -n 2

      - name: Install dir stays on the release channel (no .git copied)
        run: test ! -e "$HOME/.local/share/pyhp/.git"

      - name: Uninstall cleanly
        run: |
          ./uninstall.sh
          test ! -e "$HOME/.local/share/pyhp"
          test ! -e "$HOME/.local/bin/pyhp"
          echo "uninstall OK"

  windows-scripts:
    name: Windows launcher & installer smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip, curl
          coverage: none

      - name: PowerShell syntax check (install.ps1 / uninstall.ps1)
        shell: pwsh
        run: |
          foreach ($f in 'install.ps1', 'uninstall.ps1') {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $f), [ref]$null, [ref]$errs) | Out-Null
            if ($errs.Count -gt 0) {
              $errs | ForEach-Object { Write-Host ("{0}:{1}: {2}" -f $f, $_.Extent.StartLineNumber, $_.Message) }
              throw "PowerShell syntax errors in $f"
            }
            Write-Host ("{0}: syntax OK" -f $f)
          }

      - name: Install to a custom dir (C:\phpl default needs no elevation here, but keep CI hermetic)
        shell: pwsh
        run: |
          ./install.ps1 -InstallDir "$env:RUNNER_TEMP\pyhp-inst" -NoPath
          & "$env:RUNNER_TEMP\pyhp-inst\pyhp.bat" version
          if ($LASTEXITCODE -ne 0) { throw "pyhp version failed (exit $LASTEXITCODE)" }
          $hello = (& "$env:RUNNER_TEMP\pyhp-inst\pyhp.bat" run examples/01_hello.pyh 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { throw "pyhp run failed (exit $LASTEXITCODE)" }
          if ($hello -notmatch 'Hello from PyHP') { throw "unexpected hello output: $hello" }
          Write-Host "pyhp.bat version + run OK"

      - name: pyhp update reports up to date (installed copy self-checks)
        shell: pwsh
        run: |
          $out = & "$env:RUNNER_TEMP\pyhp-inst\pyhp.bat" update 2>&1 | Out-String
          Write-Host $out
          if ($out -notmatch 'up to date') { throw "expected 'up to date', got: $out" }

      - name: Uninstall cleanly
        shell: pwsh
        run: |
          $env:Path = "$env:RUNNER_TEMP\pyhp-inst;$env:Path"
          & "$env:RUNNER_TEMP\pyhp-inst\uninstall.ps1" -InstallDir "$env:RUNNER_TEMP\pyhp-inst"
          if (Test-Path "$env:RUNNER_TEMP\pyhp-inst") { throw "install dir still present" }
          Write-Host "uninstall OK"
